# Render Blueprint: Dashboard > New > Blueprint > pick this repo (and this branch). Render shows the cost first.
# Everything here restarts on its own. The indexer runs on a paid instance because free ones sleep when idle,
# and a sleeping indexer stops scanning.
services:
  # Follows Robinhood Chain and stores the order book, stakes and proof events. Private: only the website talks to it.
  - type: pserv
    name: kyte-indexer
    runtime: docker
    dockerfilePath: ./ops/docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: bash ops/run-indexer.sh
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: CHAIN_ID
        value: "4663"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4200"
      - key: POLL_MS
        value: "3000"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "1200"
      - key: SITE_URL
        value: https://kyte.sh # Autopilot trigger links point here
      - key: REWARDS_POOL_USDG
        value: "20" # USDG paid per 24 h epoch (docs/USDG_REWARDS.md); set live 9 Nov 2026 with 200 USDG in UsdgRewards (10 days); 0 pays nothing
      - key: REWARDS_FIRST_EPOCH
        value: "20766" # first 24 h epoch (floor(unix/86400)) that pays: 9 Nov 2026 UTC; earlier epochs stay score-only (docs/USDG_REWARDS_FUNDING.md)
      - key: STAKER_SHARE_POOL_USDG
        value: "0" # daily USDG split over active KYTE stake, paid wallet to wallet by the keeper (docs/STAKER_USDG_SHARE.md); 0 = snapshot only
      - key: STAKER_SHARE_MIN_USDG
        value: "5" # per-wallet floor (below it a wallet gets nothing that day); never shown on the site
      - key: STAKER_SHARE_MAX_USDG
        value: "50" # per-wallet cap; never shown on the site
      - key: STAKER_SHARE_KEEPER_TOKEN # shared secret the keeper sends with POST /staker-share/paid; same value on kyte-keeper-v2
        sync: false
    disk:
      name: indexer-data
      mountPath: /app/indexer/data
      sizeGB: 1

  # The keeper (expiries, daily fee split, buybacks) is NOT in this Blueprint. It runs as the hand-made Node worker
  # kyte-keeper-v2 (build: corepack enable && corepack prepare pnpm@10.23.0 --activate && pnpm install --frozen-lockfile;
  # start: bash ops/run-keeper.sh; env KEEPER_PRIVATE_KEY, ALERT_WEBHOOK_URL, CHAIN_ID=4663, NODE_VERSION=24).
  # Declaring a Docker keeper here recreated a second, keyless copy on every sync; two keepers with one key would
  # send every transaction twice.

  # The website. Reaches the private indexer through its own /api/indexer route.
  - type: web
    name: kyte-web
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@10.23.0 --activate && pnpm install --frozen-lockfile && pnpm build
    # Not `pnpm exec`: at runtime corepack fetches the latest pnpm, which reinstalls everything and misses the port scan.
    startCommand: node_modules/.bin/next start -p $PORT
    healthCheckPath: /terms
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "4663"
      - key: NEXT_PUBLIC_DEMO
        value: "0"
      - key: NEXT_PUBLIC_INDEXER_URL
        value: /api/indexer
      - key: INDEXER_INTERNAL_HOSTPORT
        fromService:
          type: pserv
          name: kyte-indexer
          property: hostport
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: AI_GATEWAY_API_KEY # Kyte agent (/api/agent) through the Vercel AI Gateway; server only, entered in the dashboard
        sync: false
      - key: AGENT_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: AGENT_DAILY_LIMIT
        value: "30"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kyte.sh # link previews and canonical URLs use this domain
      - key: NEXT_PUBLIC_MCP_ENABLED
        value: "true" # MCP page and connector endpoint are public
      - key: NEXT_PUBLIC_LAUNCHPAD_ENABLED
        value: "true" # Launchpad page, nav link and list_graduated tool are public
      - key: NEXT_PUBLIC_AUTOPILOT_ENABLED
        value: "true" # Autopilot page, nav link, agent tools and rule routes are public
      - key: NEXT_PUBLIC_REWARDS_ENABLED
        value: "true" # USDG rewards page, nav link and get_rewards tool

  # ---------------------------------------------------------------------------------------------------------------
  # Kyte on Elysium (Kinetiq's Hyperliquid L2, chain 99901; docs/ELYSIUM.md). Same code, second chain: its own
  # private indexer and its own site at elysium.kyte.sh. The Elysium keeper is a hand-made Node worker like
  # kyte-keeper-v2 (CHAIN_ID=99901, KEEPER_PRIVATE_KEY, wallet funded with HYPE), not declared here for the same reason.
  - type: pserv
    name: kyte-indexer-elysium
    runtime: docker
    dockerfilePath: ./ops/docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: bash ops/run-indexer.sh
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: CHAIN_ID
        value: "99901"
      - key: RPC_URL
        value: https://rpc.elysium.kinetiq.xyz
      - key: START_BLOCK
        value: "3712655" # deployBlock in contracts/deployments/99901.json
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4200"
      - key: POLL_MS
        value: "3000"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "1200"
      - key: SITE_URL
        value: https://elysium.kyte.sh
      - key: REWARDS_POOL_USDG
        value: "0" # no UsdgRewards on Elysium yet
    disk:
      name: indexer-data-elysium
      mountPath: /app/indexer/data
      sizeGB: 1

  - type: web
    name: kyte-web-elysium
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@10.23.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: node_modules/.bin/next start -p $PORT
    healthCheckPath: /terms
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "99901"
      - key: NEXT_PUBLIC_DEMO
        value: "0"
      - key: NEXT_PUBLIC_INDEXER_URL
        value: /api/indexer
      - key: INDEXER_INTERNAL_HOSTPORT
        fromService:
          type: pserv
          name: kyte-indexer-elysium
          property: hostport
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: AGENT_DAILY_LIMIT
        value: "30"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://elysium.kyte.sh
      - key: NEXT_PUBLIC_MCP_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_LAUNCHPAD_ENABLED
        value: "false" # Pons and FOBO are Robinhood Chain launchpads
      - key: NEXT_PUBLIC_AUTOPILOT_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_REWARDS_ENABLED
        value: "false" # no UsdgRewards on Elysium yet
